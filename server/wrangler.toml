# 匠备 V2 · Cloudflare Worker
# 部署前请按实际域名修改 ALLOWED_ORIGINS；不要在本文件中写任何真实密钥。
name = "jiangbei-ai-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
AI_BASE_URL = "https://api.deepseek.com"
AI_MODEL = "deepseek-chat"
AI_TIMEOUT_MS = "60000"
# 逗号分隔，只写 origin（协议 + 域名 + 端口），不要带路径或结尾斜杠。
# 这里是生产白名单；本地开发请通过 .dev.vars 覆盖，加入 localhost 的端口。
ALLOWED_ORIGINS = "https://htfyu.github.io"

# 密钥与可选访问口令使用 Wrangler secret，不要写进本文件：
#   npx wrangler secret put AI_API_KEY
#   npx wrangler secret put ACCESS_TOKEN      （可选）